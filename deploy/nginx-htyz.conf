server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name htyz.space www.htyz.space;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/htyz-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://htyz.space$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.htyz.space;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/htyz.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htyz.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://htyz.space$request_uri;
}

server {
    listen 443 ssl http2;
    server_name htyz.space;
    access_log off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/htyz.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htyz.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 110m;

    location = /dsh-ea6a060b2a8d7e59da2fcd3f.yaml {
        alias /var/www/sub/dsh-ea6a060b2a8d7e59da2fcd3f.yaml;
        default_type text/yaml;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
