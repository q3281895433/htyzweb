<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>htyz.space 正在迁移 · 请今晚 18:00 后再访问</title>
  <link rel="icon" href="/logo.svg">
  <style>
    /* 维护页自包含样式：不依赖前端构建产物，确保任何情况下都能正常显示 */
    :root {
      --bg: #071012;
      --panel: #0d1a1c;
      --ink: #e8f2ec;
      --muted: #8ea8a0;
      --line: #1d302f;
      --accent: #7fd1b0;
      --warn: #f0c674;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 500px at 50% -10%, #12312c 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 620px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: .01em;
      margin-bottom: 26px;
    }
    .mark .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 5px rgba(240, 198, 116, .16);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.86); }
    }
    @media (prefers-reduced-motion: reduce) { .mark .dot { animation: none; } }

    h1 {
      font-size: clamp(22px, 5.2vw, 30px);
      line-height: 1.35;
      margin: 0 0 12px;
      letter-spacing: -.01em;
    }
    .lead { color: var(--muted); margin: 0 0 28px; font-size: 15px; }

    .when {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 20px;
      margin-bottom: 28px;
      border-radius: 12px;
      border: 1px solid rgba(240, 198, 116, .32);
      background: rgba(240, 198, 116, .08);
    }
    .when strong { color: var(--warn); font-size: 21px; letter-spacing: .01em; }
    .when span { color: var(--muted); font-size: 14px; }

    h2 { font-size: 15px; margin: 0 0 10px; color: var(--ink); }
    ul { margin: 0 0 26px; padding-left: 20px; color: var(--muted); font-size: 14.5px; }
    li { margin-bottom: 7px; }
    li strong { color: var(--ink); font-weight: 600; }

    .note {
      font-size: 13.5px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin: 0;
    }
    .note code {
      background: #0a1517;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 12.5px;
      color: var(--accent);
      word-break: break-all;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><span class="dot" aria-hidden="true"></span><span>htyz.space</span></div>

    <h1>站点正在迁移到新服务器</h1>
    <p class="lead">
      为了让所有同学都能稳定访问，我们正在把数据搬到新的服务器上。
      迁移期间页面暂时无法打开，数据不会丢失。
    </p>

    <div class="when">
      <strong>请今晚 18:00 后再来看</strong>
      <span>届时即可正常使用</span>
    </div>

    <h2>你需要知道</h2>
    <ul>
      <li>你的<strong>账号、帖子、图片、视频都会完整保留</strong>，无需重新注册</li>
      <li>迁移过程中<strong>请暂时不要发布新内容</strong>，避免提交丢失</li>
      <li>如果你之前通过代理访问本站，迁移后<strong>不再需要代理</strong></li>
      <li>如果 18:00 后仍打不开，请过一会儿再试，或联系管理员</li>
    </ul>

    <p class="note">
      本次迁移是为了解决部分网络无法访问的问题。
      如遇异常，请联系管理员 <code>3281895433</code>（QQ）。
    </p>
  </main>
</body>
</html>
